<script src="three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const R=Math.random,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[(R()*a.length)|0];
const ease=t=>t*t*(3-2*t);
const angLerp=(a,b,t)=>{const d=((b-a+PI)%(2*PI)+2*PI)%(2*PI)-PI;return a+d*t;};
const WB=690;

/* ================= AUDIO ================= */
let AC=null,MG=null,NB=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=AC.createBufferSource();s.buffer=NB;s.loop=true;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=260;
    const g=AC.createGain();g.gain.value=.05;s.connect(f);f.connect(g);g.connect(MG);s.start();
  }catch(e){AC=null;}
}
function noise(dur,freq,vol,type){
  if(!AC)return;
  const s=AC.createBufferSource();s.buffer=NB;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(MG);s.start();s.stop(AC.currentTime+dur);
}
function tone(freq,dur,vol,type,slide){
  if(!AC)return;
  const o=AC.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(freq,AC.currentTime);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide),AC.currentTime+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  o.connect(g);g.connect(MG);o.start();o.stop(AC.currentTime+dur);
}
const sfx={
  shot(k){if(k===2){noise(.38,1800,.9);tone(80,.2,.5,'square',-40);}else{noise(.16,2600,.55);tone(130,.1,.35,'square',-70);}},
  hit(){noise(.07,900,.4);},
  hurt(){tone(210,.18,.4,'sawtooth',-110);noise(.1,600,.3);},
  groan(v){if(v>.02)tone(70+R()*30,.9,v,'sawtooth',-25);},
  pick(){tone(660,.09,.2);setTimeout(()=>tone(990,.12,.2),80);},
  beep(){tone(1200,.04,.08,'square');},
  melee(){noise(.12,1400,.35,'highpass');},
  reload(){noise(.05,3000,.3,'highpass');setTimeout(()=>noise(.06,2000,.3,'highpass'),500);}
};

/* ================= RENDERER ================= */
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('game').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa8a89a);
scene.fog=new THREE.Fog(0xa8a89a,50,250);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,420);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

const hemi=new THREE.HemisphereLight(0xbfd0d8,0x3b3a2a,.8);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe0b0,1.05);
sun.position.set(60,90,40);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
const sc=sun.shadow.camera;sc.left=-40;sc.right=40;sc.top=40;sc.bottom=-40;sc.near=10;sc.far=240;
sun.shadow.bias=-.0006;
scene.add(sun);scene.add(sun.target);

const domeMat=new THREE.ShaderMaterial({
  uniforms:{top:{value:new THREE.Color(0x5d7488)},hor:{value:new THREE.Color(0xa8a89a)}},
  vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top;uniform vec3 hor;varying float h;void main(){gl_FragColor=vec4(mix(hor,top,pow(clamp(h,0.0,1.0),0.55)),1.0);}',
  side:THREE.BackSide,depthWrite:false,fog:false});
const dome=new THREE.Mesh(new THREE.SphereGeometry(380,16,10),domeMat);
dome.frustumCulled=false;dome.renderOrder=-1;scene.add(dome);

/* ================= DUNIA ================= */
const REG=[
 {id:'barat',nm:'KALIMANTAN BARAT',city:'Pontianak',x:-520,z:0,col:[.40,.46,.25],fog:[.66,.66,.60],dens:.5},
 {id:'tengah',nm:'KALIMANTAN TENGAH',city:'Palangka Raya',x:0,z:0,col:[.19,.30,.17],fog:[.56,.63,.56],dens:1},
 {id:'selatan',nm:'KALIMANTAN SELATAN',city:'Banjarmasin',x:0,z:520,col:[.42,.48,.24],fog:[.63,.65,.56],dens:.55},
 {id:'timur',nm:'KALIMANTAN TIMUR',city:'Samarinda',x:520,z:0,col:[.36,.29,.22],fog:[.62,.48,.42],dens:.35},
 {id:'utara',nm:'KALIMANTAN UTARA',city:'Tanjung Selor',x:0,z:-520,col:[.31,.42,.23],fog:[.60,.65,.68],dens:.8}
];
function regIdx(x,z){let b=0,bd=1e9;for(let i=0;i<5;i++){const d=Math.hypot(x-REG[i].x,z-REG[i].z);if(d<bd){bd=d;b=i;}}return b;}
function townDist(x,z){let bd=1e9;for(const r of REG){const d=Math.hypot(x-r.x,z-r.z);if(d<bd)bd=d;}return bd;}
function H(x,z){
  let h=Math.sin(x*.011+1.3)*Math.cos(z*.013)*3.4+Math.sin(x*.029+z*.021)*1.3+Math.sin(z*.047+x*.013)*.6;
  let fl=1;
  for(const r of REG){const d=Math.hypot(x-r.x,z-r.z);if(d<115)fl=Math.min(fl,clamp((d-72)/43,0,1));}
  h*=fl;
  if(Math.abs(x)<330){const d=Math.abs(z-455);if(d<17){const k=1-d/17;h-=k*k*2.6*clamp((330-Math.abs(x))/40,0,1);}}
  const dp=Math.hypot(x-600,z+120);
  if(dp<60){const k=1-dp/60;h-=k*k*(3-2*k)*9;}
  return h;
}
function canvasTex(w,h,draw,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;
  if(rep)t.repeat.set(rep[0],rep[1]);return t;
}
/* terrain */
{
  const N=200,S=1500;
  const geo=new THREE.PlaneGeometry(S,S,N,N);geo.rotateX(-PI/2);
  const pos=geo.attributes.position;const col=new Float32Array(pos.count*3);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i),y=H(x,z);pos.setY(i,y);
    let rr=0,gg=0,bb=0,ws=0,tw=0;
    for(const r of REG){
      const d=Math.hypot(x-r.x,z-r.z),w=Math.exp(-d*d/(2*260*260));
      rr+=r.col[0]*w;gg+=r.col[1]*w;bb+=r.col[2]*w;ws+=w;
      tw=Math.max(tw,1-clamp((d-70)/30,0,1));
    }
    rr/=ws;gg/=ws;bb/=ws;
    const nz=(Math.sin(x*.21)*Math.cos(z*.17)+Math.sin(x*.07+z*.09))*.035;
    rr=lerp(rr,.40,tw*.8);gg=lerp(gg,.40,tw*.8);bb=lerp(bb,.38,tw*.8);
    const dp=Math.hypot(x-600,z+120);
    if(dp<64){const k=clamp(1-dp/64,0,1);rr=lerp(rr,.07,k);gg=lerp(gg,.07,k);bb=lerp(bb,.07,k);}
    if(y<-.3){rr=.30;gg=.25;bb=.17;}
    col[i*3]=Math.max(0,rr+nz);col[i*3+1]=Math.max(0,gg+nz);col[i*3+2]=Math.max(0,bb+nz);
  }
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
  const tex=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#d0d0d0';g.fillRect(0,0,w,h);for(let i=0;i<1800;i++){const v=150+R()*90|0;g.fillStyle='rgb('+v+','+v+','+v+')';g.fillRect(R()*w,R()*h,2,2);}},[220,220]);
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,map:tex}));
  m.receiveShadow=true;scene.add(m);
  const water=new THREE.Mesh(new THREE.PlaneGeometry(660,36),new THREE.MeshStandardMaterial({color:0x2f5a58,roughness:.2,metalness:.15,transparent:true,opacity:.82}));
  water.rotation.x=-PI/2;water.position.set(0,-.8,455);scene.add(water);
}

/* material & primitive helpers */
const matCache={};
function M(c,r){const k=c+'_'+(r||.85);if(!matCache[k])matCache[k]=new THREE.MeshStandardMaterial({color:c,roughness:r||.85});return matCache[k];}
const BOX=new THREE.BoxGeometry(1,1,1);
function part(w,h,d,c,x,y,z,parent,shadow){
  const m=new THREE.Mesh(BOX,typeof c==='object'?c:M(c));m.scale.set(w,h,d);m.position.set(x,y,z);
  m.castShadow=!!shadow;if(parent)parent.add(m);return m;
}

/* collision grid */
const CELL=16,grid=new Map();
const K=(i,j)=>(i+500)*1000+(j+500);
function addObs(o){
  const ex=o.r!==undefined?o.r:Math.max(o.hw,o.hd);
  const i0=Math.floor((o.x-ex)/CELL),i1=Math.floor((o.x+ex)/CELL),j0=Math.floor((o.z-ex)/CELL),j1=Math.floor((o.z+ex)/CELL);
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const k=K(i,j);let a=grid.get(k);if(!a){a=[];grid.set(k,a);}a.push(o);}
}
function pushOut(p,rad){
  const i=Math.floor(p.x/CELL),j=Math.floor(p.z/CELL);
  for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){
    const a=grid.get(K(i+di,j+dj));if(!a)continue;
    for(let n=0;n<a.length;n++){
      const o=a[n];
      if(o.r!==undefined){
        let dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz);const m=o.r+rad;
        if(d<m){if(d<1e-4){dx=1;dz=0;d=1;}p.x=o.x+dx/d*m;p.z=o.z+dz/d*m;}
      }else{
        const cx=clamp(p.x,o.x-o.hw,o.x+o.hw),cz=clamp(p.z,o.z-o.hd,o.z+o.hd);
        const dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
        if(d2<rad*rad){
          if(d2>1e-6){const d=Math.sqrt(d2);p.x=cx+dx/d*rad;p.z=cz+dz/d*rad;}
          else{const lx=p.x-o.x,lz=p.z-o.z,px=o.hw-Math.abs(lx),pz=o.hd-Math.abs(lz);
            if(px<pz)p.x=o.x+(lx<0?-1:1)*(o.hw+rad);else p.z=o.z+(lz<0?-1:1)*(o.hd+rad);}
        }
      }
    }
  }
}
function blockedAt(x,z){
  const a=grid.get(K(Math.floor(x/CELL),Math.floor(z/CELL)));if(!a)return false;
  for(const o of a){if(o.r===undefined&&Math.abs(x-o.x)<o.hw&&Math.abs(z-o.z)<o.hd)return true;}
  return false;
}

/* bangunan */
const bTex=canvasTex(64,64,(g,w,h)=>{
  g.fillStyle='#bdb8ac';g.fillRect(0,0,w,h);
  for(let i=0;i<200;i++){g.fillStyle='rgba(0,0,0,.05)';g.fillRect(R()*w,R()*h,3,1);}
  g.fillStyle='#26333d';g.fillRect(w*.18,h*.22,w*.64,h*.46);
  g.fillStyle='#4a5b66';g.fillRect(w*.18,h*.22,w*.64,h*.08);
  g.strokeStyle='#8f8a80';g.strokeRect(0,0,w,h);
});
const bMats=[0xffffff,0xd9c9a8,0xb7c3c8,0xe3b9a2,0xc9d0b5].map(c=>new THREE.MeshStandardMaterial({color:c,map:bTex,roughness:.9}));
function building(x,z,w,d,h,mi){
  const g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv;
  const dims=[[d,h],[d,h],[0,0],[0,0],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let v=0;v<4;v++){
    const i=f*4+v;
    if(dims[f][0]===0)uv.setXY(i,.02,.02);else uv.setXY(i,uv.getX(i)*dims[f][0]/4,uv.getY(i)*dims[f][1]/3.6);
  }
  const m=new THREE.Mesh(g,bMats[mi%bMats.length]);
  m.position.set(x,H(x,z)+h/2-.3,z);m.castShadow=true;m.updateMatrix();m.matrixAutoUpdate=false;scene.add(m);
  addObs({x,z,hw:w/2,hd:d/2});
}
function car(x,z,rot,color){
  const g=new THREE.Group();
  part(4.2,1,1.9,color,0,.8,0,g,true);part(2.2,.8,1.7,0x2a3238,-.2,1.6,0,g,true);
  part(.5,.5,.5,0x111111,1.4,.35,.95,g);part(.5,.5,.5,0x111111,-1.4,.35,.95,g);
  part(.5,.5,.5,0x111111,1.4,.35,-.95,g);part(.5,.5,.5,0x111111,-1.4,.35,-.95,g);

function sph(o,d,cx,cy,cz,r){
  const vx=cx-o.x,vy=cy-o.y,vz=cz-o.z,t=vx*d.x+vy*d.y+vz*d.z;
  if(t<0)return null;const p2=vx*vx+vy*vy+vz*vz-t*t;if(p2>r*r)return null;return t-Math.sqrt(r*r-p2);
}
function wallDist(o,d,range){
  for(let t=1;t<range;t+=2){
    const x=o.x+d.x*t,y=o.y+d.y*t,z=o.z+d.z*t;
    if(y<H(x,z)+6&&blockedAt(x,z))return t;

}
function hitScan(o,d,range,dmg){
  let best=null,bt=wallDist(o,d,range),head=false,isB=false;

    for(const e of arr){
      if(e.dead)continue;

      if(t!==null&&t<bt){bt=t;best=e;head=hd;isB=b;}
    }
  };
  test(Zs,false);test(Bs,true);
  if(best){
    const hx=o.x+d.x*bt,hy=o.y+d.y*bt,hz=o.z+d.z*bt;
    dmgEnemy(best,head?dmg*2.5:dmg,isB,hx,hy,hz);

  else if(s&&s.t==='killcamp')od='Sisa musuh: '+CAMPS[s.camp].alive;
  else if(s&&s.t==='survive')od=Math.max(0,Math.ceil(s.sec-survT))+' dtk'+(Math.hypot(P.x-s.x,P.z-s.z)>=s.r?' — KEMBALI KE HELIPAD!':'');
  if(tg)od+=(od?' · ':'')+Math.round(Math.hypot(tg.x-P.x,tg.z-P.z))+' m';
  if(od!==lastObjD){$('objD').textContent=od;lastObjD=od;}
  const pr=$('prompt'),it=nearInter();
  if(it){pr.style.display='block';pr.textContent=it.k==='i'?'AKSI: AMBIL SERUM':(it.s.type==='med'?'AKSI: BERI P3K':'AKSI: TOLONG');}else pr.style.display='none';
  /* bubble */
  const bub=$('bub');let nb=null,nd=28;
  for(const q of Ss){if(q.done)continue;const d=Math.hypot(q.x-P.x,q.z-P.z);if(d<nd){nd=d;nb=q;}}
  if(nb){
    v3.set(nb.x,nb.g.position.y+2.3,nb.z).project(camera);
    if(v3.z<1&&Math.abs(v3.x)<1.2){bub.style.display='block';bub.style.left=((v3.x+1)/2*innerWidth)+'px';bub.style.top=((1-v3.y)/2*innerHeight)+'px';
      const tx=nb.type==='med'?'Aku tergigit... ada obat?':nb.line;if(bub.textContent!==tx)bub.textContent=tx;}
    else bub.style.display='none';
  }else bub.style.display='none';
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0;}
  const dm=$('dmg');if(+dm.style.opacity>0)dm.style.opacity=Math.max(0,+dm.style.opacity-dt*1.6);
  if(P.hp<30)flashDmg(.25+Math.sin(performance.now()/200)*.1);
}

/* ================= LOOP ================= */
let last=performance.now(),grT=4;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'||state==='cine'||state==='cinend'){
    if(state==='play'){
      updPlayer(dt);
      ambient(dt);
      const ri=regIdx(P.x,P.z);
      if(ri!==curReg){curReg=ri;banner(REG[ri].nm,REG[ri].city);}
      if(!trig[ri]&&Math.hypot(P.x-REG[ri].x,P.z-REG[ri].z)<95&&!cine)townHorde(ri);
      stepUpdate(dt);
      grT-=dt;if(grT<=0){grT=3+R()*4;let best=1e9;for(const z of Zs)if(!z.dead&&z.state===1){const d=Math.hypot(z.x-P.x,z.z-P.z);if(d<best)best=d;}if(best<40)sfx.groan(Math.max(.03,.25-best/200));}
      updLoot(dt);
    }
    for(let i=Zs.length-1;i>=0;i--)updZ(Zs[i],dt,i);
    for(const b of Bs)updB(b,dt);
    for(const s of Ss)updS(s,dt);
    updFX(dt);
    if(state==='play'){
      updCamera();updHUD(dt);
      mmT-=dt;if(mmT<=0){mmT=.12;drawMM();}
      const tg=objTarget();
      if(tg){marker.visible=true;marker.position.set(tg.x,H(tg.x,tg.z)+28,tg.z);}else marker.visible=false;
    }else{marker.visible=false;$('bub').style.display='none';}
    if(state==='cine'||state==='cinend')updCine(dt);
    sun.position.set(P.x+60,90,P.z+40);sun.target.position.set(P.x,0,P.z);
    dome.position.copy(camera.position);
    const rg=REG[curReg<0?0:curReg];
    scene.fog.color.r=lerp(scene.fog.color.r,rg.fog[0],dt);scene.fog.color.g=lerp(scene.fog.color.g,rg.fog[1],dt);scene.fog.color.b=lerp(scene.fog.color.b,rg.fog[2],dt);
    scene.background.copy(scene.fog.color);domeMat.uniforms.hor.value.copy(scene.fog.color);
    for(const c of CAMPS){if(c.fire)c.fire.scale.setScalar(.9+Math.sin(now/90+c.x)*.15);}
    renderer.render(scene,camera);
  }else if(state==='title'||state==='pause'||state==='over'||state==='end'){
    if(state==='title'){const a=now/9000;camera.position.set(-520+Math.cos(a)*70,25,Math.sin(a)*70);camera.lookAt(-520,6,0);dome.position.copy(camera.position);renderer.render(scene,camera);}
  }
}
camera.position.set(-450,25,0);camera.lookAt(-520,6,0);
requestAnimationFrame(loop);
})();
